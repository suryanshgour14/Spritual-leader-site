<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- Background circle -->
  <circle cx="80" cy="80" r="78" fill="#7B1414"/>
  <!-- Outer gold ring -->
  <circle cx="80" cy="80" r="78" fill="none" stroke="#F2C94C" stroke-width="2.5"/>
  <!-- Secondary inner ring -->
  <circle cx="80" cy="80" r="71" fill="none" stroke="#F2C94C" stroke-width="0.8" opacity="0.55"/>

  <!-- 8 outer lotus petals -->
  <g transform="translate(80,80)">
    <ellipse cx="0" cy="-53" rx="9" ry="16" fill="#E8912A" transform="rotate(0)"/>
    <ellipse cx="0" cy="-53" rx="9" ry="16" fill="#E8912A" transform="rotate(45)"/>
    <ellipse cx="0" cy="-53" rx="9" ry="16" fill="#E8912A" transform="rotate(90)"/>
    <ellipse cx="0" cy="-53" rx="9" ry="16" fill="#E8912A" transform="rotate(135)"/>
    <ellipse cx="0" cy="-53" rx="9" ry="16" fill="#E8912A" transform="rotate(180)"/>
    <ellipse cx="0" cy="-53" rx="9" ry="16" fill="#E8912A" transform="rotate(225)"/>
    <ellipse cx="0" cy="-53" rx="9" ry="16" fill="#E8912A" transform="rotate(270)"/>
    <ellipse cx="0" cy="-53" rx="9" ry="16" fill="#E8912A" transform="rotate(315)"/>
    <!-- 8 inner petals between the outer ones -->
    <ellipse cx="0" cy="-39" rx="6" ry="11" fill="#C86820" opacity="0.85" transform="rotate(22.5)"/>
    <ellipse cx="0" cy="-39" rx="6" ry="11" fill="#C86820" opacity="0.85" transform="rotate(67.5)"/>
    <ellipse cx="0" cy="-39" rx="6" ry="11" fill="#C86820" opacity="0.85" transform="rotate(112.5)"/>
    <ellipse cx="0" cy="-39" rx="6" ry="11" fill="#C86820" opacity="0.85" transform="rotate(157.5)"/>
    <ellipse cx="0" cy="-39" rx="6" ry="11" fill="#C86820" opacity="0.85" transform="rotate(202.5)"/>
    <ellipse cx="0" cy="-39" rx="6" ry="11" fill="#C86820" opacity="0.85" transform="rotate(247.5)"/>
    <ellipse cx="0" cy="-39" rx="6" ry="11" fill="#C86820" opacity="0.85" transform="rotate(292.5)"/>
    <ellipse cx="0" cy="-39" rx="6" ry="11" fill="#C86820" opacity="0.85" transform="rotate(337.5)"/>
  </g>

  <!-- Mid ring with gold border -->
  <circle cx="80" cy="80" r="31" fill="#6B1010"/>
  <circle cx="80" cy="80" r="31" fill="none" stroke="#F2C94C" stroke-width="1.5"/>

  <!-- Inner circle -->
  <circle cx="80" cy="80" r="25" fill="#5C0F0F"/>

  <!-- ॐ symbol centred -->
  <text x="80" y="89" text-anchor="middle" font-size="28" fill="#F2C94C" font-family="serif">ॐ</text>

  <!-- Gold dots at cardinal points on mid ring -->
  <circle cx="80" cy="49" r="2.2" fill="#F2C94C"/>
  <circle cx="111" cy="80" r="2.2" fill="#F2C94C"/>
  <circle cx="80" cy="111" r="2.2" fill="#F2C94C"/>
  <circle cx="49" cy="80" r="2.2" fill="#F2C94C"/>
</svg>
