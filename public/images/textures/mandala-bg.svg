    <!-- Petal arcs -->
    <path d="M200,20 Q240,60 200,100 Q160,60 200,20 Z"/>
    <path d="M380,200 Q340,240 300,200 Q340,160 380,200 Z"/>
    <path d="M200,380 Q160,340 200,300 Q240,340 200,380 Z"/>
