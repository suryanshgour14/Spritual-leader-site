    <path d="M200,145 C215,160 215,185 200,200 C185,215 160,215 145,200 C160,185 185,185 200,145Z" opacity="0.5"/>
    <path d="M200,255 C215,240 215,215 200,200 C185,185 160,185 145,200 C160,215 185,215 200,255Z" opacity="0.5"/>
    <path d="M145,200 C160,185 185,185 200,200 C185,215 185,240 145,200Z" opacity="0.5"/>
    <path d="M255,200 C240,215 215,215 200,200 C215,185 215,160 255,200Z" opacity="0.5"/>

    <!-- Dots on outer ring -->
    <circle cx="200" cy="22" r="3" fill="#D4860A"/>
    <circle cx="337" cy="83" r="3" fill="#D4860A"/>
    <circle cx="378" cy="200" r="3" fill="#D4860A"/>
    <circle cx="337" cy="317" r="3" fill="#D4860A"/>
    <circle cx="200" cy="378" r="3" fill="#D4860A"/>
    <circle cx="63" cy="317" r="3" fill="#D4860A"/>
